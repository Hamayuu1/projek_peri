<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Masuk — PERI Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body class="login-page">
    <main class="login-card">
      <img src="assets/logo.svg" alt="" class="login-logo" />
      <h1>PERI Admin</h1>
      <p class="login-sub">Masuk untuk mengelola website lembaga.</p>

      <form id="form-login" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required />

        <label for="sandi">Kata sandi</label>
        <input id="sandi" name="sandi" type="password" autocomplete="current-password" required />

        <p id="pesan" class="login-pesan" role="alert" aria-live="polite"></p>
        <button type="submit" class="btn btn-primary" id="tombol">Masuk</button>
      </form>
    </main>
    <script src="js/login.js"></script>
  </body>
</html>
